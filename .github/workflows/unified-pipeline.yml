name: 'Daily Intelligence Pipeline'

on:
  schedule:
    # Every 4 Hours Aligned with Global Market Releases (UT Cron: 01:30, 05:30, 09:30, 13:30, 17:30, 21:30)
    - cron: '30 1,5,9,13,17,21 * * *'
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Time window in days (default: 36h)'
        required: false
        default: '36h'

jobs:
  run-pipeline:
    name: 'Run Unified Intelligence Pipeline'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 'Checkout Runner Repository'
        uses: actions/checkout@4
        with:
          path: runner

      - name: 'Initialize Data Store'
        env:
          SVC_A: ${{ secrets.CI_SVC_A }}
          SVC_STORE: ${{ secrets.CI_SVC_STORE }}
        run: |
          git clone https://x-access-token:$SVC_A@$SVC_STORE vault
          echo 'Data store initialized.'

      - name: 'Set up Python 3.11'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 'Install Dependencies'
        run: |
          pip install --upgrade pip
          pip install -r runner/requirements.txt

      - name: 'Execute Pipeline'
        env:
          DAYS_BACK: ${{ inputs.days_back || '36h' }}
          PYTHONUNBUFFERED: '1'
          SVC_A: ${{ secrets.CI_SVC_A }}
          SVC_B: ${{ secrets.CI_SVC_B }}
          VAULT_DIR: ${{ github.workspace }}/vault
          RUNNER_DIR: ${{ github.workspace }}/runner
        run: |
          cd ${{ github.workspace }}
          python runner/.github/scripts/run_unified_intelligence_pipeline.py \
            --vault-dir vault \
            --runner-dir runner

      - name: 'Sync Results'
        env:
          SVC_A: ${{ secrets.CI_SVC_A }}
          SVC_STORE: ${{ secrets.CI_SVC_STORE }}
        run: |
          cd vault
          git config user.name '007ashishaggarwal-svg'
          git config user.email '007ashishaggarwal-svg@users.noreply.github.com'
          git remote set-url origin https://x-access-token:$SVC_A@$SVC_STORE
          git add -A
          git diff --quiet && git diff --staged --quiet && echo 'No changes.' || \
            (git commit -m 'chore: sync intelligence updates [skip ci]' && \
             git push origin HEAD:main)


      - name: 'Upload Artifacts'
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output
          path: |
            vault/RSSFeedChecker_Master_Guide_and_Data.xlsx
            vault/results/
            vault/web/data/
          retention-days: 30
