name: Daily Intelligence Pipeline

# ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
# SECURITY: Only schedule and manual dispatch. NO pull_request trigger.
# This prevents any external fork from ever executing with secrets.
# ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
on:
  schedule:
    # 6:00 AM IST (UTC+05:30) = 00:30 UTC every day
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Time window in days (default: 3)'
        required: false
        default: '36h'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ΓöÇΓöÇΓöÇΓöÇΓöÇ STEP 1: Checkout Runner Code ΓöÇΓöÇΓöÇΓöÇΓöÇ
      - name: Checkout Runner Repository
        uses: actions/checkout@v4
        with:
          path: runner

      # ΓöÇΓöÇΓöÇΓöÇΓöÇ STEP 2: Clone Data Store ΓöÇΓöÇΓöÇΓöÇΓöÇ
      - name: Initialize Data Store
        env:
          SVC_A: ${{ secrets.CI_SVC_A }}
          SVC_STORE: ${{ secrets.CI_SVC_STORE }}
        run: |
          git clone https://x-access-token:$SVC_A@$SVC_STORE vault
          echo "Data store initialized."

      # ΓöÇΓöÇΓöÇΓöÇΓöÇ STEP 3: Set up Python 3.11 ΓöÇΓöÇΓöÇΓöÇΓöÇ
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # no cache

      # ΓöÇΓöÇΓöÇΓöÇΓöÇ STEP 4: Install Dependencies ΓöÇΓöÇΓöÇΓöÇΓöÇ
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install openpyxl requests beautifulsoup4 curl-cffi googlenewsdecoder

      # ΓöÇΓöÇΓöÇΓöÇΓöÇ STEP 5: Execute Pipeline ΓöÇΓöÇΓöÇΓöÇΓöÇ
      - name: Execute Pipeline
        env:
          DAYS_BACK: ${{ inputs.days_back || '3' }}
          PYTHONUNBUFFERED: '1'
          SVC_A: ${{ secrets.CI_SVC_A }}
          SVC_B: ${{ secrets.CI_SVC_B }}
          VAULT_DIR: ${{ github.workspace }}/vault
          RUNNER_DIR: ${{ github.workspace }}/runner
        run: |
          cd ${{ github.workspace }}
          python runner/.github/scripts/run_unified_intelligence_pipeline.py \
            --vault-dir vault \
            --runner-dir runner

      # ΓöÇΓöÇΓöÇΓöÇΓöÇ STEP 6: Commit & Push Updated Results ΓöÇΓöÇΓöÇΓöÇΓöÇ
      - name: Sync Results
        env:
          SVC_A: ${{ secrets.CI_SVC_A }}
        run: |
          cd vault
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(echo -n x-access-token:$SVC_A | base64)"
          git add -A
          git diff --quiet && git diff --staged --quiet && echo "No changes." || \
            (git commit -m "chore: sync [skip ci]" && \
             git push origin HEAD:main)

      # ΓöÇΓöÇΓöÇΓöÇΓöÇ STEP 7: Upload Artifacts ΓöÇΓöÇΓöÇΓöÇΓöÇ
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output
          path: |
            vault/RSSFeedChecker_Master_Guide_and_Data.xlsx
            vault/results/
            vault/web/data/
          retention-days: 30
