name: 'Daily Intelligence Pipeline'

on:
  schedule:
    # Every 4 Hours Aligned with Global Market Releases (UT Cron: 01:30, 05:30, 09:30, 13:30, 17:30, 21:30)
    - cron: '30 1,5,9,13,17,21 * * *'
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Time window in days or hours (e.g. 24h, 36h, 48h, 7d)'
        required: false
        default: '36h'

jobs:
  run-pipeline:
    name: 'Run Unified Intelligence Pipeline'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 'Checkout Thin Runner Repository'
        uses: actions/checkout@v4
        with:
          path: runner

      - name: 'Clone Canonical Private Data & Code Vault'
        env:
          SVC_A: ${{ secrets.CI_SVC_A }}
          SVC_STORE: ${{ secrets.CI_SVC_STORE }}
        run: |
          git clone https://x-access-token:$SVC_A@$SVC_STORE vault
          cd vault
          echo "CANONICAL_REPO_SHA: $(git rev-parse HEAD)"
          cd ../runner
          echo "RUNNER_REPO_SHA: $(git rev-parse HEAD)"
          echo 'Canonical private vault successfully cloned.'

      - name: 'Set up Python 3.11'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 'Install Dependencies'
        run: |
          pip install --upgrade pip
          pip install -r runner/requirements.txt

      - name: 'Execute Canonical Pipeline from Vault'
        env:
          DAYS_BACK: ${{ inputs.days_back || '36h' }}
          PYTHONUNBUFFERED: '1'
          CI_SVC_A: ${{ secrets.CI_SVC_A }}
          CI_SVC_B: ${{ secrets.CI_SVC_B }}
          CI_SVC_C: ${{ secrets.CI_SVC_C }}
          CI_SVC_D: ${{ secrets.CI_SVC_D }}
          CI_SVC_E: ${{ secrets.CI_SVC_E }}
          CI_SVC_STORE: ${{ secrets.CI_SVC_STORE }}
          VAULT_DIR: ${{ github.workspace }}/vault
        run: |
          cd ${{ github.workspace }}/vault
          python .github/scripts/run_unified_intelligence_pipeline.py --since "${{ inputs.days_back || '36h' }}"

      - name: 'Sync Results Back to Private Vault'
        env:
          SVC_A: ${{ secrets.CI_SVC_A }}
          SVC_STORE: ${{ secrets.CI_SVC_STORE }}
        run: |
          cd ${{ github.workspace }}/vault
          git config user.name '007ashishaggarwal-svg'
          git config user.email '007ashishaggarwal-svg@users.noreply.github.com'
          git remote set-url origin https://x-access-token:$SVC_A@$SVC_STORE
          git add RSSFeedChecker_Master_Guide_and_Data.xlsx web/data/ .cache/ results/ || true
          if ! git diff --staged --quiet; then
            git commit -m 'chore: sync intelligence updates [skip ci]'
            git push origin main
            echo 'Results pushed to private repository.'
          else
            echo 'No changes to commit.'
          fi
