name: check

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install gspread requests
      - name: Test All Secrets
        env:
          A: ${{ secrets.CI_SVC_A }}
          B: ${{ secrets.CI_SVC_B }}
          C: ${{ secrets.CI_SVC_C }}
          D: ${{ secrets.CI_SVC_D }}
          E: ${{ secrets.CI_SVC_E }}
          STORE: ${{ secrets.CI_SVC_STORE }}
          G1: ${{ secrets.G_IPA_YEK }}
          G2: ${{ secrets.G_IPA_YEK_PRO }}
        run: |
          python3 - << 'EOF'
          import os, json, subprocess
          target_repo = "007ashishaggarwal-svg/pearlsofinsights-combo"
          target_sheet_id = "1j_3c92wD4tE97_rM_vB0m_x_FakeIdOrReal"

          print("=== DETAILED temp_02 SECRETS AUDIT ===")
          secrets = {
              "CI_SVC_A": os.environ.get("A", "").strip(),
              "CI_SVC_B": os.environ.get("B", "").strip(),
              "CI_SVC_C": os.environ.get("C", "").strip(),
              "CI_SVC_D": os.environ.get("D", "").strip(),
              "CI_SVC_E": os.environ.get("E", "").strip(),
              "CI_SVC_STORE": os.environ.get("STORE", "").strip(),
              "G_IPA_YEK": os.environ.get("G1", "").strip(),
              "G_IPA_YEK_PRO": os.environ.get("G2", "").strip(),
          }

          sa_val = None
          sheet_id_val = None

          for name, val in secrets.items():
              if not val:
                  print(f"{name:<15}: [EMPTY]")
                  continue
              if "service_account" in val and "private_key" in val:
                  try:
                      d = json.loads(val)
                      email = d.get("client_email", "")
                      print(f"{name:<15}: [GOOGLE SA] Valid Service Account JSON ({email})")
                      sa_val = val
                  except Exception as e:
                      print(f"{name:<15}: [GOOGLE SA ERROR] Invalid JSON: {e}")
              elif len(val) >= 30 and len(val) <= 60 and "/" not in val and " " not in val:
                  print(f"{name:<15}: [SHEET ID] Candidate Sheet ID ({val[:8]}...{val[-4:]})")
                  sheet_id_val = val
              elif val.startswith("ghp_") or val.startswith("github_pat_") or val.startswith("gho_") or len(val) in (40, 93):
                  # Test clone
                  res = subprocess.run(["git", "clone", "--depth", "1", f"https://x-access-token:{val}@github.com/{target_repo}.git", "test_vault"], capture_output=True)
                  if res.returncode == 0:
                      print(f"{name:<15}: [PAT PASS] Valid GitHub Token! Can clone {target_repo}")
                      subprocess.run(["rm", "-rf", "test_vault"])
                  else:
                      print(f"{name:<15}: [PAT FAIL] Token cannot access {target_repo}")
              elif val.startswith("AIzaSy"):
                  print(f"{name:<15}: [GEMINI KEY] Valid Gemini API Key format")
              else:
                  print(f"{name:<15}: [UNKNOWN / CONFIG] Length={len(val)} chars")

          # If SA and Sheet ID found, test gspread connection
          if sa_val and sheet_id_val:
              try:
                  import gspread
                  client = gspread.service_account_from_dict(json.loads(sa_val))
                  sh = client.open_by_key(sheet_id_val)
                  print(f"
Live Google Sheet Test: [CONNECTED] Title: '{sh.title}'")
              except Exception as e:
                  print(f"
Live Google Sheet Test: [FAILED] {e}")
          EOF
